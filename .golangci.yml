version: "2"

linters:
  default: standard
  enable:
    - revive
  settings:
    revive:
      # Only these two rules, not revive's default set: they catch the
      # parameters and receivers the standard linters do not look at.
      rules:
        - name: unused-receiver
        - name: unused-parameter
  exclusions:
    rules:
      # A guard, an action and a hook all have signatures fixed by the API, so
      # one that ignores its context or its payload cannot drop the parameter,
      # only rename it to _. Tests are full of them, and naming the parameter
      # is often what documents what the callback would have received.
      - linters: [revive]
        path: _test\.go

# An unused receiver and an unused parameter sit on the same signature line,
# and only one issue per line is reported by default, which would hide the
# second until the first was fixed.
issues:
  uniq-by-line: false
